version: '3.8'

services:
  # Aegis
  gateway:
    build: .
    container_name: aegis
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ASG_ENVIRONMENT: production
      ASG_DEBUG: "false"
      ASG_LOG_LEVEL: INFO
      ASG_SQLITE_PATH: /app/data/gateway.db
      ASG_LOG_DIR: /app/logs
      ASG_BACKUP_DIR: /app/data/backups
      ASG_REQUIRE_AGENT_REGISTRATION: "true"
      ASG_ENFORCE_AGENT_ROLES_FROM_REGISTRY: "true"
      ASG_STRICT_BLOCK_DELETE_PRODUCTION: "true"
      ASG_AUDIT_PAYLOAD_MODE: redact
      # Load from .env file for sensitive values
      # - OPENAI_API_KEY
      # - ASG_FERNET_KEY
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./.env:/app/.env:ro
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - monitor

  # Nginx reverse proxy with TLS termination
  nginx:
    image: nginx:alpine
    container_name: ai-safety-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - gateway-network
    depends_on:
      - gateway

  # Prometheus for metrics (optional monitoring)
  monitor:
    image: prom/prometheus:latest
    container_name: ai-safety-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge

volumes:
  prometheus-data:
