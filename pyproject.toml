[project]
name = "aegis-safety"
version = "2.0.0"
description = "Production-grade AI safety gateway — token scoping, policy guardrails, sandbox simulation, risk scoring, human-in-the-loop approval, controlled execution, and audit trail."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Harsh Bopaliya", email = "harshbopaliya@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
keywords = ["ai-safety", "gateway", "guardrails", "llm", "fastapi", "human-in-the-loop"]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "slowapi>=0.1.9",
    "python-json-logger>=2.0.7",
    "cryptography>=42.0.0",
    "openai>=2.33.0",
]

[project.optional-dependencies]
# Full server with all monitoring and security
server = [
    "prometheus-client>=0.19.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "APScheduler>=3.10.4",
]
# OpenAI integration for demo/agent features
openai = [
    "openai>=1.40.0",
]
# Development and testing tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]
# All optional dependencies
all = [
    "aegis-safety[server,openai,dev]",
]

[project.urls]
Homepage = "https://github.com/harshbopaliya/aegis"
Documentation = "https://github.com/harshbopaliya/aegis#readme"
Repository = "https://github.com/harshbopaliya/aegis"
"Issue Tracker" = "https://github.com/harshbopaliya/aegis/issues"

[project.scripts]
aegis = "aegis.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aegis*"]
exclude = ["tests*", "examples*", "app*", "static*"]

[tool.setuptools.package-data]
aegis = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["aegis"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
